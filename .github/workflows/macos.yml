name: macOS

# Runs the release workflow's offline test suites on Apple Silicon (macos-14, arm64), then packs every package and smoke-tests
# the installed PiSharp.Cli tool (PiSharp.Tools.Tests is left out: its process and shell fixtures are Windows-only). Releases still build on
# Linux (release.yml); this checks that what they ship works on a Mac. Each suite is its own job so one failure hides no other.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - PiSharp.AzureResponses.Tests
          - PiSharp.MistralConversations.Tests
          - PiSharp.AnthropicAuthSync.Tests
          - PiSharp.McpSync.Tests
          - PiSharp.ProviderSync.Tests
          - PiSharp.WireSync.Tests
          - PiSharp.CliSync.Tests
          - PiSharp.ToolSearch.Tests
          - PiSharp.Classifiers.Tests
          - PiSharp.Models.Tests
          - PiSharp.Codemode.Tests
          - PiSharp.ProviderApis.Tests
          - PiSharp.CliParity.Tests
          - PiSharp.McpParity.Tests
          - PiSharp.SessionParity.Tests
          - PiSharp.InteractiveParity.Tests
          - PiSharp.ExtensionParity.Tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # PiSharp.ExtensionParity.Tests runs TypeScript extensions with Node.js 22.13 or later and installs Pi's npm packages.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # macOS's TMPDIR (/var/folders/…) is a symlink to /private/var/folders/…. A Mac process's working directory is always the
      # resolved path (getcwd), in Pi and PiSharp alike, so the suites' temp workspaces use it too.
      - name: Run ${{ matrix.suite }}
        run: |
          uname -m
          export TMPDIR="$(cd "$TMPDIR" && pwd -P)/"
          dotnet run --project "tests/${{ matrix.suite }}/${{ matrix.suite }}.csproj" -c Release \
            -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false \
            -- --report "$RUNNER_TEMP/${{ matrix.suite }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.suite }}
          path: ${{ runner.temp }}/${{ matrix.suite }}.json
          if-no-files-found: ignore

  package:
    name: Pack and smoke-test the tool
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        run: |
          v=$(sed -n 's/.*<VersionPrefix[^>]*>\([^<]*\)<\/VersionPrefix>.*/\1/p' Directory.Build.props)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Pack and validate
        shell: pwsh
        run: >
          ./tools/release/build-release-packages.ps1
          -Version '${{ steps.version.outputs.version }}'
          -SourceCommit '${{ github.sha }}'

      # Installed outside the repository: its NuGet.Config clears every feed, and the tool's dependencies come from nuget.org.
      - name: Install and run PiSharp.Cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          feed="$GITHUB_WORKSPACE/artifacts/packages"
          cd "$RUNNER_TEMP"
          dotnet tool install PiSharp.Cli --tool-path "$RUNNER_TEMP/tool" --add-source "$feed" --version "$VERSION"
          "$RUNNER_TEMP/tool/pisharp" --version
          "$RUNNER_TEMP/tool/pisharp" --version | grep -F "$VERSION"
          "$RUNNER_TEMP/tool/pisharp" --help > help.txt
          head -20 help.txt
          grep -q -- "--model" help.txt
