name: Durable

# CI for the experimental pi-durable port (decision 0005), released as experimental in 1.2.0.1. Runs on main, on
# feature/pi-durable and on feature/durable-network (decision 0008, the device host); the release workflow also runs both durable suites on Linux. The test job's storage.sqlite.native case loads
# e_sqlite3 on each OS; sqlite-publish checks that a publish for each release RID carries that RID's e_sqlite3 native asset.
on:
  push:
    branches: [main, feature/pi-durable, feature/durable-network]
  pull_request:
    branches: [main, feature/pi-durable, feature/durable-network]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Durable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # macOS's TMPDIR (/var/folders/…) is a symlink to /private/var/folders/…; tests use the resolved path, as a Mac process does.
      - name: Run PiSharp.Durable.Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR="$(cd "$TMPDIR" && pwd -P)/"; fi
          dotnet run --project tests/PiSharp.Durable.Tests/PiSharp.Durable.Tests.csproj -c Release \
            -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false \
            -- --report "$RUNNER_TEMP/durable-${{ matrix.os }}.json"

      # Upstream's `npm test` runs the suite a second time with every unobserved document evicted right after use
      # (test/setup-document-retention.ts); SetupDocumentRetentionCases.cs reads the same variable.
      - name: Run PiSharp.Durable.Tests with document retention 0
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PI_DURABLE_DOCUMENT_RETENTION_MS: "0"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR="$(cd "$TMPDIR" && pwd -P)/"; fi
          dotnet run --project tests/PiSharp.Durable.Tests/PiSharp.Durable.Tests.csproj -c Release             -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false             -- --report "$RUNNER_TEMP/durable-retention-0-${{ matrix.os }}.json"

      - name: Run PiSharp.DurableCli.Tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR="$(cd "$TMPDIR" && pwd -P)/"; fi
          dotnet run --project tests/PiSharp.DurableCli.Tests/PiSharp.DurableCli.Tests.csproj -c Release             -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false             -- --report "$RUNNER_TEMP/durable-cli-${{ matrix.os }}.json"

      # Decision 0008: the device host, on its faux model only.
      - name: Run PiSharp.Durable.Hosting.Tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR="$(cd "$TMPDIR" && pwd -P)/"; fi
          dotnet run --project tests/PiSharp.Durable.Hosting.Tests/PiSharp.Durable.Hosting.Tests.csproj -c Release             -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false             -- --report "$RUNNER_TEMP/durable-hosting-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-hosting-report-${{ matrix.os }}
          path: ${{ runner.temp }}/durable-hosting-${{ matrix.os }}.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-cli-report-${{ matrix.os }}
          path: ${{ runner.temp }}/durable-cli-${{ matrix.os }}.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-report-${{ matrix.os }}
          path: ${{ runner.temp }}/durable-${{ matrix.os }}.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-retention-0-report-${{ matrix.os }}
          path: ${{ runner.temp }}/durable-retention-0-${{ matrix.os }}.json
          if-no-files-found: ignore

  sqlite-publish:
    name: SQLite native asset (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: e_sqlite3.dll
          - rid: linux-x64
            asset: libe_sqlite3.so
          - rid: linux-musl-x64
            asset: libe_sqlite3.so
          - rid: osx-arm64
            asset: libe_sqlite3.dylib
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Framework-dependent and without an apphost, so no runtime or host pack is needed; the publish is checked, not run.
      - name: Publish PiSharp.Durable.Tests for ${{ matrix.rid }}
        run: |
          dotnet publish tests/PiSharp.Durable.Tests/PiSharp.Durable.Tests.csproj -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:UseAppHost=false -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false \
            -o "$RUNNER_TEMP/publish"

      - name: Check the e_sqlite3 native asset
        run: |
          out="$RUNNER_TEMP/publish"
          version=$(jq -r '.dependencies["net10.0"]["SQLitePCLRaw.lib.e_sqlite3"].resolved' src/PiSharp.Durable.Sqlite/packages.lock.json)
          expected="$HOME/.nuget/packages/sqlitepclraw.lib.e_sqlite3/$version/runtimes/${{ matrix.rid }}/native/${{ matrix.asset }}"
          for file in ${{ matrix.asset }} Microsoft.Data.Sqlite.dll SQLitePCLRaw.core.dll SQLitePCLRaw.provider.e_sqlite3.dll \
            SQLitePCLRaw.batteries_v2.dll PiSharp.Durable.Sqlite.dll; do
            if [ ! -s "$out/$file" ]; then echo "::error::$file is missing from the ${{ matrix.rid }} publish"; ls -la "$out"; exit 1; fi
          done
          # The asset must be the package's build for this RID (the linux-x64 and linux-musl-x64 builds differ).
          cmp "$out/${{ matrix.asset }}" "$expected"
          echo "${{ matrix.rid }}: ${{ matrix.asset }} from SQLitePCLRaw.lib.e_sqlite3 $version ($(stat -c %s "$out/${{ matrix.asset }}") bytes)"

  port-map:
    name: Port map matches the pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Pi at the pinned commit and the previous pin
        # The map is built from git objects: Pi v1.2.0 (the pin) and Pi v1.1.0 (the previous pin it records changes against).
        run: |
          git init -q "$RUNNER_TEMP/pi" && cd "$RUNNER_TEMP/pi"
          git fetch -q --depth 1 https://github.com/earendil-works/pi 06a466935536f8c9bcacb2d5efc0fc021be1bdff abe508e1b89912adde45528136c3221eb69acdd7
      - name: Check compatibility/durable-port-map.json
        run: node tools/DurablePortMap/build-port-map.mjs --upstream "$RUNNER_TEMP/pi" --check
