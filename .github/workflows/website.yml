name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'compatibility/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # npm install rather than npm ci: the lock file is generated on Windows and
      # omits Linux-only optional dependencies that npm ci would reject.
      - name: Install
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
