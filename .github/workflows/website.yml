name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'compatibility/**'
      - 'samples/agents/catalog.json'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'compatibility/**'
      - 'samples/agents/catalog.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # npm install rather than npm ci: the lock file is generated on Windows and
      # omits Linux-only optional dependencies that npm ci would reject.
      - name: Install
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify links, tokens, llms.txt and sample catalog
        working-directory: website
        run: npm run check
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
