name: Release

# Push a version tag (v0.99.1, or v0.99.1.1 for a C#-only patch) to build, validate,
# publish every package to NuGet with trusted publishing, and create the GitHub release.
# Run manually to do a dry run: it builds and validates the packages but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and validate (dry run, nothing is published)
        required: true
        default: '0.99.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, pack and validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid PiSharp version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Run offline provider tests
        run: |
          for t in PiSharp.AzureResponses.Tests PiSharp.MistralConversations.Tests; do
            dotnet run --project "tests/$t/$t.csproj" -c Release \
              -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false
          done

      - name: Pack and validate
        shell: pwsh
        run: >
          ./tools/release/build-release-packages.ps1
          -Version '${{ steps.version.outputs.version }}'
          -SourceCommit '${{ github.sha }}'

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/validation/*.json
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: exchanges this run's OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    name: Create GitHub release
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          args=(--title "PiSharp $VERSION" --verify-tag)
          notes="docs/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" artifacts/packages/*.nupkg
