name: Release

# Push a version tag (v1.5.0, or v1.5.0.1 for a C#-only patch) to build, validate,
# publish every package to NuGet with trusted publishing, and create the GitHub release.
# Run manually to do a dry run: it builds and validates the packages but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and validate (dry run, nothing is published)
        required: true
        default: '1.5.0.1'
      skip_tests:
        description: Skip the 22 release-list suites (dry runs only; core/Durable validation still runs)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-validation:
    uses: ./.github/workflows/core.yml
    with:
      source_sha: ${{ github.sha }}

  durable-validation:
    uses: ./.github/workflows/durable.yml
    with:
      source_sha: ${{ github.sha }}
      include_web: false

  gap-validation:
    uses: ./.github/workflows/gap-regressions.yml
    with:
      source_sha: ${{ github.sha }}

  native-env-validation:
    uses: ./.github/workflows/env-native.yml
    with:
      source_sha: ${{ github.sha }}

  build:
    name: Build, pack and validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # PiSharp.ExtensionParity.Tests runs TypeScript extensions with Node.js 22.13 or later (module.stripTypeScriptTypes) and
      # installs the Pi 1.2.0 packages with npm; the runner image's default Node.js is older.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid PiSharp version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 22 explicitly selected suites; core and Durable gates run at this exact SHA.
      - name: Verify historical model catalog evidence
        if: github.event_name == 'push' || !inputs.skip_tests
        run: node tools/ci/ensure-historical-ai-archive.mjs

      - name: Run offline tests
        if: github.event_name == 'push' || !inputs.skip_tests
        run: |
          mkdir -p "$RUNNER_TEMP/release-reports"
          export PISHARP_TEST_DOTNET="$(command -v dotnet)"
          for t in PiSharp.AzureResponses.Tests PiSharp.MistralConversations.Tests PiSharp.AnthropicAuthSync.Tests PiSharp.McpSync.Tests PiSharp.ProviderSync.Tests PiSharp.WireSync.Tests PiSharp.CliSync.Tests PiSharp.ToolSearch.Tests PiSharp.Classifiers.Tests PiSharp.Models.Tests PiSharp.Schema.Tests PiSharp.Telemetry.Tests PiSharp.Codemode.Tests PiSharp.ProviderApis.Tests PiSharp.CliParity.Tests PiSharp.McpParity.Tests PiSharp.SessionParity.Tests PiSharp.InteractiveParity.Tests PiSharp.ExtensionParity.Tests PiSharp.Durable.Tests PiSharp.DurableCli.Tests PiSharp.CustomAgents.Tests; do
            dotnet run --project "tests/$t/$t.csproj" -c Release \
              -p:RestoreSources=https://api.nuget.org/v3/index.json -p:RestoreLockedMode=false \
              -- --report "$RUNNER_TEMP/release-reports/$t.json"
          done

      - name: Current checkout release suite manifest
        if: always() && (github.event_name == 'push' || !inputs.skip_tests)
        shell: bash
        run: |
          reports=()
          for t in PiSharp.AzureResponses.Tests PiSharp.MistralConversations.Tests PiSharp.AnthropicAuthSync.Tests PiSharp.McpSync.Tests PiSharp.ProviderSync.Tests PiSharp.WireSync.Tests PiSharp.CliSync.Tests PiSharp.ToolSearch.Tests PiSharp.Classifiers.Tests PiSharp.Models.Tests PiSharp.Schema.Tests PiSharp.Telemetry.Tests PiSharp.Codemode.Tests PiSharp.ProviderApis.Tests PiSharp.CliParity.Tests PiSharp.McpParity.Tests PiSharp.SessionParity.Tests PiSharp.InteractiveParity.Tests PiSharp.ExtensionParity.Tests PiSharp.Durable.Tests PiSharp.DurableCli.Tests PiSharp.CustomAgents.Tests; do reports+=(--report "$t=$RUNNER_TEMP/release-reports/$t.json"); done
          node tools/ci/write-validation-manifest.mjs "${reports[@]}" --output "$RUNNER_TEMP/release-reports/manifest.json" --prerequisite "dotnet-sdk=$(dotnet --version)" --prerequisite "node=$(node --version); npm and frozen fixtures; no provider keys"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'push' || !inputs.skip_tests)
        with:
          name: release-suite-reports
          path: ${{ runner.temp }}/release-reports
          if-no-files-found: error

      - name: Pack and validate
        shell: pwsh
        run: >
          ./tools/release/build-release-packages.ps1
          -Version '${{ steps.version.outputs.version }}'
          -SourceCommit '${{ github.sha }}'

      # Decision 0005: `pisharp durable` stores its sessions in SQLite. The tool must carry the durable assemblies, Microsoft.Data.Sqlite,
      # their licenses, and SQLitePCLRaw's e_sqlite3 build for each release platform, byte for byte as restored. Reads the archive only.
      - name: Check the tool's durable SQLite payload
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tool="artifacts/packages/PiSharp.Cli.$VERSION.nupkg"
          prefix=tools/net10.0/any
          members=$(unzip -Z1 "$tool")
          for member in PiSharp.Durable.dll PiSharp.Durable.Tools.dll PiSharp.Durable.Sqlite.dll Microsoft.Data.Sqlite.dll \
            SQLitePCLRaw.core.dll SQLitePCLRaw.provider.e_sqlite3.dll SQLitePCLRaw.batteries_v2.dll \
            licenses/Microsoft.Data.Sqlite.LICENSE.txt licenses/SQLitePCLRaw.LICENSE.txt licenses/SQLitePCLRaw.NOTICE.txt \
            licenses/SQLite.NOTICE.txt licenses/jsdiff.LICENSE.txt licenses/ripgrep-ignore.LICENSE-MIT.txt; do
            if ! grep -qxF "$prefix/$member" <<< "$members"; then echo "::error::$member is missing from $tool"; exit 1; fi
          done
          version=$(jq -r '.dependencies["net10.0"]["SQLitePCLRaw.lib.e_sqlite3"].resolved' src/PiSharp.Durable.Sqlite/packages.lock.json)
          for asset in win-x64/native/e_sqlite3.dll linux-x64/native/libe_sqlite3.so linux-musl-x64/native/libe_sqlite3.so \
            osx-arm64/native/libe_sqlite3.dylib; do
            unzip -p "$tool" "$prefix/runtimes/$asset" | cmp - "$HOME/.nuget/packages/sqlitepclraw.lib.e_sqlite3/$version/runtimes/$asset"
            echo "$asset: SQLitePCLRaw.lib.e_sqlite3 $version"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/validation/*.json
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: [build, core-validation, durable-validation, gap-validation, native-env-validation]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: exchanges this run's OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    name: Create GitHub release
    needs: [build, publish, core-validation, durable-validation, gap-validation, native-env-validation]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: node tools/release/publish-github-release.mjs
