name: Core validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'AI_DOCS/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'AI_DOCS/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  core:
    name: Core console (${{ matrix.suite }}, Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [Compatibility, Agent, Transport, Sessions, Tools, CodingAgent, Rpc, Extensions.ContractTests, ExtensionHost, Tui, Extensions.AI]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install native search prerequisite
        shell: pwsh
        run: choco install ripgrep fd --yes --no-progress
      - name: Run console suite with native fixture prerequisites
        shell: pwsh
        run: ./tools/ci/run-core-suite.ps1 -Suite '${{ matrix.suite }}' -ReportDirectory '${{ runner.temp }}/core'
      - name: Record actual cases and checkout provenance
        if: always()
        shell: pwsh
        run: |
          $suite = if ('${{ matrix.suite }}' -eq 'Extensions.ContractTests') { 'PiSharp.Extensions.ContractTests' } else { 'PiSharp.${{ matrix.suite }}.Tests' }
          node tools/ci/write-validation-manifest.mjs --output '${{ runner.temp }}/core/manifest.json' --execution '${{ runner.temp }}/core/execution.json' --report "$suite=${{ runner.temp }}/core/$suite.json" --console "$suite=${{ runner.temp }}/core/console.log" --prerequisite "dotnet-sdk=$(dotnet --version)" --prerequisite 'Windows native process and ConPTY support' --prerequisite 'native extension fixtures published for CodingAgent/Extensions.ContractTests by runner' --reject-skips
          $manifestExit = $LASTEXITCODE
          if (Test-Path -LiteralPath '${{ runner.temp }}/core/manifest.json') {
            $summaryArgs = @('--manifest', '${{ runner.temp }}/core/manifest.json', '--trx', "${{ runner.temp }}/core/$suite.trx", '--title', "Core console ($suite)")
            if ($env:GITHUB_STEP_SUMMARY) { $summaryArgs += @('--summary', $env:GITHUB_STEP_SUMMARY, '--append') }
            node tools/ci/manifest-to-trx.mjs @summaryArgs
          }
          if ($manifestExit -ne 0) { exit $manifestExit }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-${{ matrix.suite }}
          path: ${{ runner.temp }}/core
          if-no-files-found: error

  applicability:
    name: Offline and frozen-source applicability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Offline applicability and worklist structure
        run: |
          node --test tools/CompatibilityReport/sync-applicability.test.mjs tools/CompatibilityReport/sync-1.5.2-applicability.test.mjs tools/CompatibilityReport/accept-sync-1.5.2.test.mjs tools/CompatibilityReport/sync-1.6.0-applicability.test.mjs tools/ci/validation-manifest.test.mjs tools/release/publish-github-release.test.mjs tools/release/generate-package-manifests.test.mjs
          node --test tools/ci/historical-ai-archive.test.mjs
          node tools/TuiData/pack-word-data.mjs
          node tools/DurablePortMap/check-worklist.mjs --offline
      - name: Fetch immutable upstream objects
        shell: bash
        run: |
          git init "$RUNNER_TEMP/pi"
          git -C "$RUNNER_TEMP/pi" fetch --depth 1 https://github.com/earendil-works/pi 7d073328e44337d3292a7db9b0f0308f679c5e97 f9a26365568127461c47a07a37dcb42c140a3ac5 06a466935536f8c9bcacb2d5efc0fc021be1bdff b4afdddf44e059c67ccf5097e5317d913521b470 faac585884ae2c013a6b1400f3e9e77f10b34bac fb0fe823539f6d04850f6e34748c01f01f212e1f
          git -C "$RUNNER_TEMP/pi" checkout --detach 7d073328e44337d3292a7db9b0f0308f679c5e97
          test "$(git -C "$RUNNER_TEMP/pi" rev-parse HEAD)" = 7d073328e44337d3292a7db9b0f0308f679c5e97
          git -C "$RUNNER_TEMP/pi" tag v1.5.0 f9a26365568127461c47a07a37dcb42c140a3ac5
          git -C "$RUNNER_TEMP/pi" tag v1.2.0 06a466935536f8c9bcacb2d5efc0fc021be1bdff
          git -C "$RUNNER_TEMP/pi" tag v1.5.2 b4afdddf44e059c67ccf5097e5317d913521b470
          git -C "$RUNNER_TEMP/pi" tag v1.6.0 faac585884ae2c013a6b1400f3e9e77f10b34bac
          git -C "$RUNNER_TEMP/pi" tag v1.7.0 fb0fe823539f6d04850f6e34748c01f01f212e1f
      - name: Required historical exact-object checks (no skipped upstream check)
        env:
          PI_REQUIRE_UPSTREAM: '1'
          PI_UPSTREAM_V1_5_0: ${{ runner.temp }}/pi
        run: |
          node --test tools/CompatibilityReport/sync-applicability.test.mjs
          node tools/DurablePortMap/check-worklist.mjs --upstream "$RUNNER_TEMP/pi"
          node tools/DurablePortMap/build-port-map.mjs --upstream "$RUNNER_TEMP/pi" --map compatibility/durable-port-map.v1.5.0.json --check
      - name: Required preserved Pi 1.5.2 source and applicability checks
        env:
          PI_REQUIRE_UPSTREAM: '1'
          PI_UPSTREAM_V1_5_2: ${{ runner.temp }}/pi
        run: |
          node --test tools/CompatibilityReport/sync-1.5.2-source.test.mjs tools/CompatibilityReport/sync-1.5.2-applicability.test.mjs
      - name: Required preserved Pi 1.6.0 source and applicability checks
        env:
          PI_REQUIRE_UPSTREAM: '1'
          PI_UPSTREAM_V1_6_0: ${{ runner.temp }}/pi
        run: |
          git -C "$RUNNER_TEMP/pi" checkout --detach faac585884ae2c013a6b1400f3e9e77f10b34bac
          test "$(git -C "$RUNNER_TEMP/pi" rev-parse HEAD)" = faac585884ae2c013a6b1400f3e9e77f10b34bac
          node --test tools/CompatibilityReport/sync-1.6.0-source.test.mjs tools/CompatibilityReport/sync-1.6.0-applicability.test.mjs
      - name: Required current Pi 1.7.0 source and Durable mapping checks
        env:
          PI_REQUIRE_UPSTREAM: '1'
          PI_UPSTREAM_V1_7_0: ${{ runner.temp }}/pi
        run: |
          git -C "$RUNNER_TEMP/pi" checkout --detach "$(jq -r '.source.commit' compatibility/target.lock.json)"
          node --test tools/CompatibilityReport/sync-1.7.0-source.test.mjs
          node tools/DurablePortMap/sync-1.7.0.mjs "$RUNNER_TEMP/pi" --check
          node tools/CompatibilityReport/verify-baseline.mjs --upstream "$RUNNER_TEMP/pi"

  templates:
    name: Project templates (dotnet new)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack and smoke-test PiSharp.Templates
        shell: pwsh
        run: ./tools/ci/test-templates.ps1
